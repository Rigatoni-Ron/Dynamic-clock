<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Clock</title>
  <style>
    :root {
      --bg: #D6D9DD;
      --face: #FFFFFF;
      --rim: #C5C9CF;
      --ink: #1A1A1A;
      --red: #E63312;
      --accent: #FFCC00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .clock {
      width: min(82vmin, 620px);
      aspect-ratio: 1 / 1;
      display: block;
    }

    .hour-numeral {
      font-size: 13px;
      font-weight: 500;
      fill: var(--red);
    }

    .minute-numeral {
      font-size: 3.2px;
      fill: var(--ink);
    }

    .minute-numeral.major {
      font-weight: 700;
    }

    .inner-label {
      font-size: 2.6px;
      fill: var(--ink);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Analog clock">
      <!-- Face -->
      <circle r="96" fill="var(--face)" stroke="var(--rim)" stroke-width="0.6" />

      <!-- Inner guide ring with cardinal labels -->
      <g class="inner-guide">
        <circle cx="0" cy="0" r="14" fill="none" stroke="var(--ink)" stroke-width="0.35" />
        <circle cx="0"   cy="-14" r="0.75" fill="var(--ink)" />
        <circle cx="14"  cy="0"   r="0.75" fill="var(--ink)" />
        <circle cx="0"   cy="14"  r="0.75" fill="var(--ink)" />
        <circle cx="-14" cy="0"   r="0.75" fill="var(--ink)" />
        <text class="inner-label" x="0"   y="-17" text-anchor="middle" dominant-baseline="auto">o'clock</text>
        <text class="inner-label" x="22"  y="0"   text-anchor="middle" dominant-baseline="central">1/4 past</text>
        <text class="inner-label" x="0"   y="18"  text-anchor="middle" dominant-baseline="hanging">1/2 past</text>
        <text class="inner-label" x="-22" y="0"   text-anchor="middle" dominant-baseline="central">1/4 to</text>
      </g>

      <!-- Minute / second numerals 1-60 -->
      <g id="minuteNumerals"></g>

      <!-- Hour numerals 1-12 -->
      <g id="hourNumerals"></g>

      <!-- Hour hand (red pill, hollow slot near tip) -->
      <g id="hour">
        <rect x="-3" y="-46" width="6" height="58" rx="3" fill="var(--red)" />
        <rect x="-1.4" y="-41" width="2.8" height="4.5" rx="1.4" fill="var(--face)" />
      </g>

      <!-- Minute hand (black pill, hollow slot near tip) -->
      <g id="minute">
        <rect x="-2.5" y="-76" width="5" height="89" rx="2.5" fill="var(--ink)" />
        <rect x="-1.15" y="-71" width="2.3" height="4.2" rx="1.15" fill="var(--face)" />
      </g>

      <!-- Second hand (yellow accent) -->
      <g id="second">
        <line x1="0" y1="16" x2="0" y2="-80" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round" />
        <circle cx="0" cy="-80" r="2" fill="var(--accent)" />
      </g>

      <!-- Center cap -->
      <circle r="3.2" fill="var(--ink)" />
    </svg>
  </main>

  <script>
    (function () {
      const svgns = 'http://www.w3.org/2000/svg';
      const hourGroup = document.getElementById('hourNumerals');
      const minuteGroup = document.getElementById('minuteNumerals');
      const hourHand = document.getElementById('hour');
      const minuteHand = document.getElementById('minute');
      const secondHand = document.getElementById('second');

      for (let h = 1; h <= 12; h++) {
        const angle = h * 30 * Math.PI / 180;
        const x = Math.sin(angle) * 72;
        const y = -Math.cos(angle) * 72;
        const t = document.createElementNS(svgns, 'text');
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.setAttribute('class', 'hour-numeral');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.textContent = h;
        hourGroup.appendChild(t);
      }

      for (let m = 1; m <= 60; m++) {
        const angle = m * 6 * Math.PI / 180;
        const x = Math.sin(angle) * 89;
        const y = -Math.cos(angle) * 89;
        const t = document.createElementNS(svgns, 'text');
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.setAttribute('class', 'minute-numeral' + (m % 5 === 0 ? ' major' : ''));
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.textContent = m;
        minuteGroup.appendChild(t);
      }

      function tick() {
        const now = new Date();
        const ms = now.getMilliseconds();
        const s = now.getSeconds() + ms / 1000;
        const m = now.getMinutes() + s / 60;
        const h = (now.getHours() % 12) + m / 60;

        secondHand.setAttribute('transform', `rotate(${s * 6})`);
        minuteHand.setAttribute('transform', `rotate(${m * 6})`);
        hourHand.setAttribute('transform', `rotate(${h * 30})`);

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
