<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #D6D9DD;
      --face: #ececec;
      --rim: #C5C9CF;
      --ink: #1A1A1A;
      --red: #E63312;
      --accent: #FFCC00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      font-family: "Helvetica Neue", "Inter", "Arial", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 28px;
    }

    .zone {
      text-align: center;
      user-select: none;
    }

    .zone-city,
    .zone-offset {
      position: relative;
      /* Clip vertically only — cells size to their text and may extend
         past the wrapper horizontally without being cropped. */
      clip-path: inset(0 -50vw);
    }

    .zone-city {
      display: block;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      height: 1.15em;
    }

    .zone-offset {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-size: 12px;
      font-weight: 500;
      color: rgba(26, 26, 26, 0.55);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 8px;
      line-height: 1.4;
      height: 1.4em;
    }

    .roll-cell {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      will-change: transform;
    }

    .char-row {
      display: inline-flex;
      align-items: flex-start;
    }

    .char-slot {
      position: relative;
      display: inline-block;
      vertical-align: top;
    }

    .char-phantom {
      visibility: hidden;
      white-space: pre;
    }

    .char-cell {
      position: absolute;
      top: 0;
      left: 0;
      white-space: pre;
      will-change: transform;
    }

    .zone-hint {
      font-size: 11px;
      color: rgba(26, 26, 26, 0.4);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    .clock {
      width: min(82vmin, 580px);
      aspect-ratio: 1 / 1;
      display: block;
      touch-action: none;
    }

    #hour { cursor: grab; }
    #hour.dragging { cursor: grabbing; }

    .reset-btn {
      position: absolute;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      appearance: none;
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(26, 26, 26, 0.22);
      padding: 9px 20px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.22s ease,
        background-color 0.15s ease,
        color 0.15s ease,
        transform 0.12s ease;
    }

    .reset-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .reset-btn:hover {
      background: var(--ink);
      color: var(--face);
    }

    .reset-btn.visible:active {
      transform: translateX(-50%) scale(0.97);
    }

    .hour-numeral {
      font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 900;
      fill: var(--red);
    }

    .minute-numeral {
      font-size: 3.2px;
      fill: var(--ink);
    }

    .minute-numeral.major {
      font-weight: 700;
    }

    .inner-label {
      font-size: 2.6px;
      fill: var(--ink);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="stage">
    <header class="zone">
      <div class="zone-city" id="zoneCity">London</div>
      <div class="zone-offset" id="zoneOffset"><span class="utc-static">UTC</span><span class="char-row" id="charRow"></span></div>
      <div class="zone-hint">drag the hour hand</div>
    </header>

    <svg class="clock" viewBox="-100 -100 200 200" role="img" aria-label="Analog clock">
      <!-- Face -->
      <circle r="96" fill="var(--face)" stroke="var(--rim)" stroke-width="0.6" />

      <!-- Inner guide ring with cardinal labels -->
      <g class="inner-guide">
        <circle cx="0" cy="0" r="14" fill="none" stroke="var(--ink)" stroke-width="0.35" />
        <circle cx="0"   cy="-14" r="0.75" fill="var(--ink)" />
        <circle cx="14"  cy="0"   r="0.75" fill="var(--ink)" />
        <circle cx="0"   cy="14"  r="0.75" fill="var(--ink)" />
        <circle cx="-14" cy="0"   r="0.75" fill="var(--ink)" />
        <text class="inner-label" x="0"   y="-17" text-anchor="middle" dominant-baseline="auto">o'clock</text>
        <text class="inner-label" x="22"  y="0"   text-anchor="middle" dominant-baseline="central">1/4 past</text>
        <text class="inner-label" x="0"   y="18"  text-anchor="middle" dominant-baseline="hanging">1/2 past</text>
        <text class="inner-label" x="-22" y="0"   text-anchor="middle" dominant-baseline="central">1/4 to</text>
      </g>

      <!-- Minute / second numerals 1-60 -->
      <g id="minuteNumerals"></g>

      <!-- Hour numerals 1-12 -->
      <g id="hourNumerals"></g>

      <!-- Hour hand (red pill, hollow slot near tip) -->
      <g id="hour">
        <rect x="-7" y="-50" width="14" height="34" fill="transparent" pointer-events="all" />
        <rect x="-3" y="-46" width="6" height="26" rx="3" fill="var(--red)" />
        <rect x="-1.4" y="-41" width="2.8" height="4.5" rx="1.4" fill="var(--face)" />
      </g>

      <!-- Minute hand (black pill, hollow slot near tip) -->
      <g id="minute">
        <rect x="-2.5" y="-76" width="5" height="56" rx="2.5" fill="var(--ink)" />
        <rect x="-1.15" y="-71" width="2.3" height="4.2" rx="1.15" fill="var(--face)" />
      </g>

      <!-- Second hand (yellow accent) -->
      <g id="second">
        <line x1="0" y1="-20" x2="0" y2="-80" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round" />
        <circle cx="0" cy="-80" r="2" fill="var(--accent)" />
      </g>

      <!-- Center cap -->
      <circle r="3.2" fill="var(--ink)" />
    </svg>

    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </main>

  <script>
    (function () {
      const svgns = 'http://www.w3.org/2000/svg';
      const svg = document.querySelector('.clock');
      const hourNumerals = document.getElementById('hourNumerals');
      const minuteNumerals = document.getElementById('minuteNumerals');
      const hourHand = document.getElementById('hour');
      const minuteHand = document.getElementById('minute');
      const secondHand = document.getElementById('second');
      const zoneCity = document.getElementById('zoneCity');
      const zoneOffset = document.getElementById('zoneOffset');
      const charRow = document.getElementById('charRow');
      const resetBtn = document.getElementById('resetBtn');

      // Candidate IANA zones, ordered by display preference.
      // The first candidate matching a given current offset wins for that slot.
      const ZONE_CANDIDATES = [
        { zone: 'Etc/GMT+12',          city: 'Baker Island' },
        { zone: 'Pacific/Pago_Pago',   city: 'Pago Pago' },
        { zone: 'Pacific/Honolulu',    city: 'Honolulu' },
        { zone: 'Pacific/Gambier',     city: 'Gambier' },
        { zone: 'America/Anchorage',   city: 'Anchorage' },
        { zone: 'America/Los_Angeles', city: 'Los Angeles' },
        { zone: 'America/Phoenix',     city: 'Phoenix' },
        { zone: 'America/Denver',      city: 'Denver' },
        { zone: 'America/Mexico_City', city: 'Mexico City' },
        { zone: 'America/Chicago',     city: 'Chicago' },
        { zone: 'America/New_York',    city: 'New York' },
        { zone: 'America/Halifax',     city: 'Halifax' },
        { zone: 'America/Sao_Paulo',   city: 'Sao Paulo' },
        { zone: 'Atlantic/South_Georgia', city: 'South Georgia' },
        { zone: 'Atlantic/Cape_Verde', city: 'Cape Verde' },
        { zone: 'Atlantic/Azores',     city: 'Azores' },
        { zone: 'Atlantic/Reykjavik',  city: 'Reykjavik' },
        { zone: 'Europe/London',       city: 'London' },
        { zone: 'Africa/Lagos',        city: 'Lagos' },
        { zone: 'Europe/Paris',        city: 'Paris' },
        { zone: 'Africa/Johannesburg', city: 'Johannesburg' },
        { zone: 'Europe/Athens',       city: 'Athens' },
        { zone: 'Africa/Cairo',        city: 'Cairo' },
        { zone: 'Europe/Moscow',       city: 'Moscow' },
        { zone: 'Asia/Dubai',          city: 'Dubai' },
        { zone: 'Asia/Karachi',        city: 'Karachi' },
        { zone: 'Asia/Dhaka',          city: 'Dhaka' },
        { zone: 'Asia/Bangkok',        city: 'Bangkok' },
        { zone: 'Asia/Singapore',      city: 'Singapore' },
        { zone: 'Asia/Tokyo',          city: 'Tokyo' },
        { zone: 'Australia/Brisbane',  city: 'Brisbane' },
        { zone: 'Australia/Sydney',    city: 'Sydney' },
        { zone: 'Pacific/Noumea',      city: 'Noumea' },
        { zone: 'Pacific/Fiji',        city: 'Fiji' },
        { zone: 'Pacific/Auckland',    city: 'Auckland' },
        { zone: 'Pacific/Apia',        city: 'Apia' },
        { zone: 'Pacific/Kiritimati',  city: 'Kiritimati' },
      ];

      // Compute the current UTC offset (in hours) for an IANA zone.
      // Works by formatting the date in that zone, treating the parts as UTC,
      // then comparing to the actual UTC timestamp.
      function getOffsetForZone(zone, date) {
        const dtf = new Intl.DateTimeFormat('en-US', {
          timeZone: zone,
          hour12: false,
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
        });
        const parts = {};
        for (const p of dtf.formatToParts(date)) {
          if (p.type !== 'literal') parts[p.type] = p.value;
        }
        const hour = parts.hour === '24' ? 0 : parseInt(parts.hour, 10);
        const asUTC = Date.UTC(
          parseInt(parts.year, 10),
          parseInt(parts.month, 10) - 1,
          parseInt(parts.day, 10),
          hour,
          parseInt(parts.minute, 10),
          parseInt(parts.second, 10)
        );
        return (asUTC - date.getTime()) / 3600000;
      }

      function buildTimezones() {
        const now = new Date();
        const map = new Map();
        for (const c of ZONE_CANDIDATES) {
          let offset;
          try { offset = getOffsetForZone(c.zone, now); }
          catch (_) { continue; }
          if (!Number.isFinite(offset)) continue;
          if (Math.abs(offset - Math.round(offset)) > 0.01) continue; // skip half-hour zones
          const k = Math.round(offset);
          if (k < -12 || k > 14) continue;
          if (!map.has(k)) map.set(k, c.city);
        }
        const result = [];
        for (let o = -12; o <= 14; o++) {
          const sign = o >= 0 ? '+' : '-';
          result.push({ offset: o, city: map.get(o) || `UTC${sign}${Math.abs(o)}` });
        }
        return result;
      }

      const TIMEZONES = buildTimezones();

      const localOffset = Math.max(-12, Math.min(14,
        Math.round(-new Date().getTimezoneOffset() / 60)));
      let utcOffset = localOffset;

      // If the user's IANA zone has a meaningful city name, use it for their slot.
      try {
        const localZoneName = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (localZoneName && localZoneName.includes('/')) {
          const localCity = localZoneName.split('/').pop().replace(/_/g, ' ');
          const match = TIMEZONES.find(z => z.offset === localOffset);
          if (match) match.city = localCity;
        }
      } catch (_) {}

      for (let h = 1; h <= 12; h++) {
        const angle = h * 30 * Math.PI / 180;
        const x = Math.sin(angle) * 72;
        const y = -Math.cos(angle) * 72;
        const t = document.createElementNS(svgns, 'text');
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.setAttribute('class', 'hour-numeral');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.textContent = h;
        hourNumerals.appendChild(t);
      }

      for (let m = 1; m <= 60; m++) {
        const angle = m * 6 * Math.PI / 180;
        const x = Math.sin(angle) * 89;
        const y = -Math.cos(angle) * 89;
        const t = document.createElementNS(svgns, 'text');
        t.setAttribute('x', x.toFixed(2));
        t.setAttribute('y', y.toFixed(2));
        t.setAttribute('class', 'minute-numeral' + (m % 5 === 0 ? ' major' : ''));
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.textContent = m;
        minuteNumerals.appendChild(t);
      }

      const ROLL_DURATION = 340;
      const ROLL_EASING = 'cubic-bezier(0.22, 1, 0.36, 1)';

      function rollText(slotEl, newText, direction) {
        const cells = slotEl.querySelectorAll('.roll-cell');
        const currentCell = cells[cells.length - 1];

        // First-time render: replace any placeholder text with a single cell.
        if (cells.length === 0) {
          slotEl.textContent = '';
          const cell = document.createElement('span');
          cell.className = 'roll-cell';
          cell.textContent = newText;
          slotEl.appendChild(cell);
          return;
        }

        if (currentCell.textContent === newText) return;

        // Drop any older in-flight cells; only the latest matters.
        for (let i = 0; i < cells.length - 1; i++) cells[i].remove();

        const dir = direction >= 0 ? 1 : -1;

        const newCell = document.createElement('span');
        newCell.className = 'roll-cell';
        newCell.textContent = newText;
        newCell.style.transform = `translate(-50%, ${dir * 100}%)`;
        slotEl.appendChild(newCell);

        // Force layout so the starting transform is committed before transition.
        newCell.getBoundingClientRect();

        const trans = `transform ${ROLL_DURATION}ms ${ROLL_EASING}`;
        currentCell.style.transition = trans;
        newCell.style.transition = trans;

        requestAnimationFrame(() => {
          currentCell.style.transform = `translate(-50%, ${-dir * 100}%)`;
          newCell.style.transform = 'translate(-50%, 0)';
        });

        setTimeout(() => {
          if (currentCell.parentNode === slotEl) currentCell.remove();
        }, ROLL_DURATION + 60);
      }

      // Per-character animation for the offset row: only changed chars roll.
      const charSlots = [];
      let lastOffsetDynamic = '';

      function makeSlot(char) {
        const slot = document.createElement('span');
        slot.className = 'char-slot';
        const phantom = document.createElement('span');
        phantom.className = 'char-phantom';
        phantom.textContent = char;
        const cell = document.createElement('span');
        cell.className = 'char-cell';
        cell.textContent = char;
        slot.appendChild(phantom);
        slot.appendChild(cell);
        return slot;
      }

      function rollSlot(slot, newChar, dir) {
        const cells = slot.querySelectorAll('.char-cell');
        const oldCell = cells[cells.length - 1];
        for (let i = 0; i < cells.length - 1; i++) cells[i].remove();

        const phantom = slot.querySelector('.char-phantom');
        if (phantom) phantom.textContent = newChar;

        const newCell = document.createElement('span');
        newCell.className = 'char-cell';
        newCell.textContent = newChar;
        newCell.style.transform = `translateY(${dir * 100}%)`;
        slot.appendChild(newCell);

        newCell.getBoundingClientRect();

        const trans = `transform ${ROLL_DURATION}ms ${ROLL_EASING}`;
        oldCell.style.transition = trans;
        newCell.style.transition = trans;

        requestAnimationFrame(() => {
          oldCell.style.transform = `translateY(${-dir * 100}%)`;
          newCell.style.transform = 'translateY(0)';
        });

        setTimeout(() => {
          if (oldCell.parentNode === slot) oldCell.remove();
        }, ROLL_DURATION + 60);
      }

      function rollSlotIn(slot, dir) {
        const cell = slot.querySelector('.char-cell');
        cell.style.transform = `translateY(${dir * 100}%)`;
        cell.getBoundingClientRect();
        cell.style.transition = `transform ${ROLL_DURATION}ms ${ROLL_EASING}`;
        requestAnimationFrame(() => {
          cell.style.transform = 'translateY(0)';
        });
      }

      function rollSlotOut(slot, dir) {
        const cells = slot.querySelectorAll('.char-cell');
        cells.forEach(cell => {
          cell.style.transition = `transform ${ROLL_DURATION}ms ${ROLL_EASING}`;
          cell.style.transform = `translateY(${-dir * 100}%)`;
        });
        setTimeout(() => {
          if (slot.parentNode) slot.remove();
        }, ROLL_DURATION + 60);
      }

      function setOffsetCharRow(newDynamic, direction) {
        const oldDynamic = lastOffsetDynamic;
        if (oldDynamic === newDynamic) return;

        const isFirstRender = charSlots.length === 0;
        const dir = direction >= 0 ? 1 : -1;
        const minLen = Math.min(oldDynamic.length, newDynamic.length);

        // Roll any chars in the shared range that actually changed.
        for (let i = 0; i < minLen; i++) {
          if (oldDynamic[i] !== newDynamic[i]) {
            rollSlot(charSlots[i], newDynamic[i], dir);
          }
        }

        // Append slots for any new positions on the right.
        for (let i = oldDynamic.length; i < newDynamic.length; i++) {
          const slot = makeSlot(newDynamic[i]);
          charSlots.push(slot);
          charRow.appendChild(slot);
          if (!isFirstRender) rollSlotIn(slot, dir);
        }

        // Remove and animate out trailing slots.
        while (charSlots.length > newDynamic.length) {
          const slot = charSlots.pop();
          rollSlotOut(slot, dir);
        }

        lastOffsetDynamic = newDynamic;
      }

      let lastDisplayedOffset = utcOffset;

      function updateZoneLabel() {
        const tz = TIMEZONES.find(z => z.offset === utcOffset)
          || { offset: utcOffset, city: 'Custom' };
        const direction = utcOffset - lastDisplayedOffset;
        const sign = utcOffset >= 0 ? '+' : '-';

        rollText(zoneCity, tz.city, direction);
        setOffsetCharRow(`${sign}${Math.abs(utcOffset)}`, direction);

        resetBtn.classList.toggle('visible', utcOffset !== localOffset);
        lastDisplayedOffset = utcOffset;
      }

      updateZoneLabel();

      function getPointerSvgPosition(event) {
        const rect = svg.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const scale = 200 / rect.width;
        return {
          x: (event.clientX - cx) * scale,
          y: (event.clientY - cy) * scale,
        };
      }

      function getPointerAngle(event) {
        const p = getPointerSvgPosition(event);
        let angle = Math.atan2(p.x, -p.y) * 180 / Math.PI;
        if (angle < 0) angle += 360;
        return angle;
      }

      function getCurrentHourHandAngle() {
        const now = new Date();
        const utcSec = now.getUTCHours() * 3600
          + now.getUTCMinutes() * 60
          + now.getUTCSeconds()
          + now.getUTCMilliseconds() / 1000;
        const local = utcSec + utcOffset * 3600;
        const h = (((local / 3600) % 12) + 12) % 12;
        return h * 30;
      }

      // Allow grabbing anywhere within a wedge near the hour hand,
      // so the minute hand never blocks the drag target.
      function isNearHourHand(event) {
        const p = getPointerSvgPosition(event);
        const distance = Math.hypot(p.x, p.y);
        if (distance < 4 || distance > 54) return false;
        const angle = getPointerAngle(event);
        const handAngle = getCurrentHourHandAngle();
        const diff = ((angle - handAngle + 540) % 360) - 180;
        return Math.abs(diff) < 18;
      }

      let dragState = null;
      let handAnim = null;

      function cancelHandAnim() {
        if (handAnim) {
          cancelAnimationFrame(handAnim.frame);
          handAnim = null;
        }
      }

      function getRenderedHandAngle() {
        const t = hourHand.getAttribute('transform') || 'rotate(0)';
        const match = t.match(/rotate\(([-0-9.]+)\)/);
        return match ? parseFloat(match[1]) : 0;
      }

      function animateHandBy(fromAngle, totalDiff, duration, easing) {
        cancelHandAnim();
        const start = performance.now();
        handAnim = { frame: 0 };
        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = easing(t);
          hourHand.setAttribute('transform', `rotate(${fromAngle + totalDiff * eased})`);
          if (t < 1) {
            handAnim.frame = requestAnimationFrame(step);
          } else {
            handAnim = null;
          }
        }
        handAnim.frame = requestAnimationFrame(step);
      }

      const easeOutBack = (t) => {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      };
      const easeInOutCubic = (t) => t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function handAngleForOffset(offset) {
        const now = new Date();
        const utcSec = now.getUTCHours() * 3600
          + now.getUTCMinutes() * 60
          + now.getUTCSeconds()
          + now.getUTCMilliseconds() / 1000;
        const local = utcSec + offset * 3600;
        const h = (((local / 3600) % 12) + 12) % 12;
        return h * 30;
      }

      svg.addEventListener('pointerdown', (e) => {
        if (!isNearHourHand(e)) return;
        e.preventDefault();
        cancelHandAnim();
        svg.setPointerCapture(e.pointerId);
        hourHand.classList.add('dragging');
        dragState = {
          pointerId: e.pointerId,
          startAngle: getPointerAngle(e),
          cumulativeDelta: 0,
          startOffset: utcOffset,
          visualAngle: handAngleForOffset(utcOffset),
        };
      });

      svg.addEventListener('pointermove', (e) => {
        if (!dragState || dragState.pointerId !== e.pointerId) return;
        e.preventDefault();
        const angle = getPointerAngle(e);
        let delta = angle - dragState.startAngle;
        // Unwrap: keep delta continuous across the 0/360 boundary.
        while (delta - dragState.cumulativeDelta > 180) delta -= 360;
        while (delta - dragState.cumulativeDelta < -180) delta += 360;
        dragState.cumulativeDelta = delta;

        const continuousOffset = dragState.startOffset + delta / 30;
        const visualOffset = Math.max(-12, Math.min(14, continuousOffset));
        const snapOffset = Math.max(-12, Math.min(14, Math.round(continuousOffset)));

        if (snapOffset !== utcOffset) {
          utcOffset = snapOffset;
          updateZoneLabel();
        }

        const visualAngle = handAngleForOffset(visualOffset);
        dragState.visualAngle = visualAngle;
        hourHand.setAttribute('transform', `rotate(${visualAngle})`);
      });

      function endDrag(e) {
        if (!dragState || dragState.pointerId !== e.pointerId) return;
        try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
        hourHand.classList.remove('dragging');

        const fromAngle = dragState.visualAngle;
        const toAngle = handAngleForOffset(utcOffset);
        const diff = ((toAngle - fromAngle + 540) % 360) - 180;
        dragState = null;

        if (Math.abs(diff) < 0.1) return;
        animateHandBy(fromAngle, diff, 220, easeOutBack);
      }

      svg.addEventListener('pointerup', endDrag);
      svg.addEventListener('pointercancel', endDrag);

      resetBtn.addEventListener('click', () => {
        if (dragState) {
          try { svg.releasePointerCapture(dragState.pointerId); } catch (_) {}
          hourHand.classList.remove('dragging');
          dragState = null;
        }
        if (utcOffset === localOffset) return;

        const fromAngle = getRenderedHandAngle();
        utcOffset = localOffset;
        updateZoneLabel();

        const toAngle = handAngleForOffset(localOffset);
        const shortDiff = ((toAngle - fromAngle + 540) % 360) - 180;
        // Always travel through at least one full revolution in the chosen direction.
        const totalDiff = shortDiff >= 0 ? shortDiff + 360 : shortDiff - 360;
        const duration = Math.min(1400, 700 + Math.abs(totalDiff) * 0.6);
        animateHandBy(fromAngle, totalDiff, duration, easeInOutCubic);
      });

      function tick() {
        const now = new Date();
        const utcSec = now.getUTCHours() * 3600
          + now.getUTCMinutes() * 60
          + now.getUTCSeconds()
          + now.getUTCMilliseconds() / 1000;
        const local = (((utcSec + utcOffset * 3600) % 86400) + 86400) % 86400;

        const s = local % 60;
        const m = (local / 60) % 60;

        secondHand.setAttribute('transform', `rotate(${s * 6})`);
        minuteHand.setAttribute('transform', `rotate(${m * 6})`);

        if (!dragState && !handAnim) {
          const h = (local / 3600) % 12;
          hourHand.setAttribute('transform', `rotate(${h * 30})`);
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
